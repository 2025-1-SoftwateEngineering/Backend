name: CI (Develop PR Test Verification)

on:
  pull_request:
    branches: ["develop"]

jobs:
  test:
    runs-on: ubuntu-latest

    # 테스트 환경용 DB 컨테이너 구동
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: testdb
          MYSQL_USER: testuser
          MYSQL_PASSWORD: testpass
          MYSQL_ROOT_PASSWORD: rootpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: 소스 코드 체크아웃
        uses: actions/checkout@v4

      - name: JDK 21 설정 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      # 스프링 컨텍스트 로드 시 FileNotFoundException 방지용 더미 파일
      - name: Firebase 설정 더미 파일 생성
        run: |
          mkdir -p src/main/resources
          cat <<EOF > src/main/resources/vocabook-firebase.json
          {
            "type": "service_account",
            "project_id": "dummy-project",
            "private_key_id": "dummy",
            "private_key": "-----BEGIN PRIVATE KEY-----\nMIIEvQIBADANBgkqhkiG9w0BAQEFAASCBKcwggSjAgEAAoIBAQDE\n-----END PRIVATE KEY-----\n",
            "client_email": "dummy@dummy.iam.gserviceaccount.com",
            "client_id": "123",
            "auth_uri": "https://accounts.google.com/o/oauth2/auth",
            "token_uri": "https://oauth2.googleapis.com/token",
            "auth_provider_x509_cert_url": "https://www.googleapis.com/oauth2/v1/certs",
            "client_x509_cert_url": "https://dummy"
          }
          EOF

      - name: gradlew 실행 권한 부여
        run: chmod +x gradlew

      - name: 환경 변수(.env) 설정
        run: |
          echo "${{ secrets.ENV_TEST }}" > .env

      # 컴파일 및 테스트 수행
      - name: Gradle 테스트 실행
        run: ./gradlew test

      # 테스트 실패 시에도 원인을 파악할 수 있도록 리포트 아티팩트 저장
      - name: 테스트 결과 리포트 업로드
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spring-test-report
          path: build/reports/tests/test/
          retention-days: 7
