<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VocaBook | Crossword Master</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #f43f5e;
            --primary-hover: #e11d48;
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.8);
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
            --cell-bg: #1e293b;
            --cell-border: #334155;
            --cell-focus: #f43f5e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        
        .container { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 20px; }
        .card { background: var(--card-bg); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 32px; padding: 40px 32px; box-shadow: 0 40px 100px -20px rgba(0, 0, 0, 0.7); }
        h1 { font-size: 2.2rem; text-align: center; margin-bottom: 32px; font-weight: 800; background: linear-gradient(to right, #fb7185, #f43f5e); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* Auth & List */
        .form-group { margin-bottom: 20px; }
        input[type="email"], input[type="password"] { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 16px; padding: 16px; color: white; transition: 0.3s; }
        input:focus { outline: none; border-color: var(--primary); }

        .list-item { background: rgba(255,255,255,0.03); border: 1px solid var(--border); padding: 24px; border-radius: 20px; margin-bottom: 16px; cursor: pointer; transition: 0.3s; display: flex; justify-content: space-between; align-items: center; }
        .list-item:hover { transform: translateY(-4px); border-color: var(--primary); background: rgba(244, 63, 94, 0.05); }
        
        button { width: 100%; background: var(--primary); color: white; border: none; padding: 18px; border-radius: 16px; font-size: 1.1rem; font-weight: 700; cursor: pointer; transition: 0.3s; }
        button:hover { background: var(--primary-hover); }
        
        .hidden { display: none !important; }

        /* Crossword UI */
        .cw-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .cw-grid-container { width: 100%; display: flex; justify-content: center; margin-bottom: 32px; }
        .cw-grid { display: grid; gap: 4px; background: var(--cell-border); padding: 4px; border-radius: 12px; }
        
        .cw-cell { 
            width: 40px; height: 40px; background: var(--cell-bg); 
            border: 1px solid var(--cell-border); border-radius: 8px; 
            display: flex; justify-content: center; align-items: center; 
            font-size: 1.2rem; font-weight: 700; color: white; 
            text-transform: uppercase; position: relative;
        }
        .cw-cell input { 
            width: 100%; height: 100%; background: transparent; border: none; 
            text-align: center; color: white; font-size: 1.2rem; font-weight: 700; text-transform: uppercase;
        }
        .cw-cell input:focus { outline: none; background: rgba(244, 63, 94, 0.1); }
        .cell-number { position: absolute; top: 2px; left: 4px; font-size: 0.6rem; color: var(--text-muted); font-weight: normal; }

        /* Clues */
        .clues-container { display: flex; flex-direction: column; gap: 24px; }
        .clue-section h3 { font-size: 1.2rem; color: var(--primary); margin-bottom: 12px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
        .clue-item { display: flex; gap: 12px; margin-bottom: 10px; font-size: 1rem; line-height: 1.5; }
        .clue-num { font-weight: 700; color: var(--text-muted); min-width: 24px; }

        #toast { position: fixed; top: 32px; left: 50%; transform: translateX(-50%); background: #1e293b; padding: 12px 24px; border-radius: 12px; z-index: 1000; display: none; border-left: 4px solid var(--primary); }
    </style>
</head>
<body>
    <div class="container">
        <!-- Auth UI -->
        <div id="auth-ui" class="card">
            <h1>Crossword Master</h1>
            <div class="form-group"><input type="email" id="email" value="test@test.com"></div>
            <div class="form-group"><input type="password" id="password" value="12341234"></div>
            <button onclick="login()">Login to Play</button>
        </div>

        <!-- List UI -->
        <div id="list-ui" class="card hidden">
            <div class="cw-header">
                <h2>Select Crossword</h2>
                <button onclick="logout()" style="width:auto; padding:8px 16px; background:transparent; border:1px solid var(--border);">Logout</button>
            </div>
            <div id="list-container"></div>
        </div>

        <!-- Crossword UI -->
        <div id="crossword-ui" class="card hidden">
            <div class="cw-header">
                <button onclick="showList()" style="width:auto; padding:8px 16px; background:transparent; border:1px solid var(--border);">← Back</button>
                <span id="cw-info" style="font-weight:700; color:var(--primary);">Set #0</span>
            </div>
            
            <div class="cw-grid-container">
                <div id="cw-grid" class="cw-grid"></div>
            </div>

            <div class="clues-container">
                <div class="clue-section" id="horizontal-clues">
                    <h3>가로 (Horizontal)</h3>
                    <div class="clue-list"></div>
                </div>
                <div class="clue-section" id="vertical-clues">
                    <h3>세로 (Vertical)</h3>
                    <div class="clue-list"></div>
                </div>
            </div>
        </div>
        <!-- Clear Modal -->
        <div id="clear-modal" class="card hidden" style="position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); z-index:2000; text-align:center;">
            <h1 style="font-size:3rem; margin-bottom:10px;">🎉 CLEAR!</h1>
            <p id="clear-time" style="font-size:1.5rem; color:var(--text); margin-bottom:24px;"></p>
            <button onclick="document.getElementById('clear-modal').classList.add('hidden'); showList();">목록으로 돌아가기</button>
        </div>
    </div>

    <!-- Overlay -->
    <div id="overlay" class="hidden" style="position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.8); z-index:1500;"></div>

    <div id="toast"></div>

    <script>
        let token = localStorage.getItem('access_token');
        let currentCwId = null;

        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            try {
                const res = await fetch('/auth/v1/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (data.isSuccess) {
                    token = data.result.accessToken;
                    localStorage.setItem('access_token', token);
                    showList();
                } else toast(data.message, 'error');
            } catch (e) { toast('Login failed', 'error'); }
        }

        function logout() { localStorage.removeItem('access_token'); location.reload(); }

        async function showList() {
            if (!token) return;
            switchUI('list-ui');
            try {
                const res = await fetch('/api/v1/crosswords?cursor=-1&pageSize=10', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                const container = document.getElementById('list-container');
                container.innerHTML = '';
                
                if (data.result && data.result.data) {
                    data.result.data.forEach(item => {
                        const div = document.createElement('div');
                        div.className = 'list-item';
                        div.onclick = () => startCrossword(item.id);
                        div.innerHTML = `
                            <div>
                                <div style="font-size: 1.4rem; font-weight: 700;">Set #${item.id}</div>
                                <div style="font-size: 0.85rem; color: var(--text-muted); margin-top: 4px;">Played: ${item.cnt} times</div>
                            </div>
                            <div style="color:#f59e0b; font-weight:700;">🪙 ${item.solvedCoin}</div>
                        `;
                        container.appendChild(div);
                    });
                }
            } catch (e) { toast('Failed to load list', 'error'); }
        }

        async function startCrossword(id) {
            currentCwId = id;
            switchUI('crossword-ui');
            document.getElementById('cw-info').innerText = `Set #${id}`;
            
            try {
                const res = await fetch(`/api/v1/crosswords/${id}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                if (data.isSuccess) {
                    renderCrossword(data.result);
                } else toast(data.message, 'error');
            } catch (e) { toast('Failed to load crossword', 'error'); }
        }

        function renderCrossword(result) {
            const n = result.n || result.N; // Handle both lowercase n and uppercase N
            const grid = document.getElementById('cw-grid');
            grid.style.gridTemplateColumns = `repeat(${n}, 1fr)`;
            grid.innerHTML = '';

            // Generate N x N empty grid cells
            const cells = [];
            for (let i = 0; i < n; i++) {
                cells[i] = [];
                for (let j = 0; j < n; j++) {
                    const cell = document.createElement('div');
                    cell.className = 'cw-cell';
                    
                    const input = document.createElement('input');
                    input.type = 'text';
                    input.maxLength = 1;
                    input.disabled = true; // 기본적으로 입력 비활성화
                    
                    const numLabel = document.createElement('span');
                    numLabel.className = 'cell-number';
                    numLabel.style.fontSize = '0.5rem';
                    numLabel.style.letterSpacing = '-0.5px';
                    numLabel.style.whiteSpace = 'nowrap';
                    
                    cell.appendChild(numLabel);
                    cell.appendChild(input);
                    grid.appendChild(cell);
                    cells[i][j] = { container: cell, numLabel, input };
                }
            }

            const hClues = document.querySelector('#horizontal-clues .clue-list');
            const vClues = document.querySelector('#vertical-clues .clue-list');
            hClues.innerHTML = '';
            vClues.innerHTML = '';

            // Render elements and clues
            let acrossIdx = 1;
            let downIdx = 1;

            result.elements.forEach(el => {
                const clueType = (el.clueType || '').toUpperCase().trim();
                // Determine 0-indexed coordinates (API now returns 0-indexed)
                const startR = el.verticalStartPoint;
                const startC = el.horizontalStartPoint;
                const len = el.wordLength || 0;

                // [중요 방어 로직] DB에 저장된 좌표가 N x N 그리드를 벗어나는 경우
                if (startR < 0 || startR >= n || startC < 0 || startC >= n) {
                    console.error("Out of bounds element skipped:", el);
                    return; // 에러를 내뿜고 죽지 않도록 현재 요소만 스킵
                }

                let currentDisplayNum;
                let labelPrefix = '';

                if (clueType === 'ACROSS') {
                    currentDisplayNum = acrossIdx++;
                    labelPrefix = '가';
                } else if (clueType === 'DOWN') {
                    currentDisplayNum = downIdx++;
                    labelPrefix = '세';
                } else {
                    console.warn("Unknown clue type:", el.clueType);
                }

                // Add number label to the starting cell
                const existingLabel = cells[startR][startC].numLabel.innerText;
                if (existingLabel) {
                    cells[startR][startC].numLabel.innerText = existingLabel + ',' + labelPrefix + currentDisplayNum;
                } else {
                    cells[startR][startC].numLabel.innerText = labelPrefix + currentDisplayNum;
                }

                // Highlight the cells to show it's part of a word
                for(let k = 0; k < len; k++) {
                    let currR = startR;
                    let currC = startC;
                    
                    if (clueType === 'ACROSS') {
                        currC += k;
                    } else if (clueType === 'DOWN') {
                        currR += k;
                    }
                    
                    if (currR >= 0 && currR < n && currC >= 0 && currC < n) {
                        cells[currR][currC].input.style.backgroundColor = 'rgba(255,255,255,0.05)';
                        cells[currR][currC].container.style.borderColor = 'rgba(244, 63, 94, 0.4)';
                        cells[currR][currC].input.disabled = false; // 단어에 포함된 칸만 입력 활성화
                        
                        // 정답 제출을 위해 el.id 저장 (여러 단어가 교차하는 칸이면 배열로 저장 가능성 고려)
                        const ids = cells[currR][currC].input.dataset.clueIds ? JSON.parse(cells[currR][currC].input.dataset.clueIds) : [];
                        ids.push(el.id);
                        cells[currR][currC].input.dataset.clueIds = JSON.stringify(ids);
                    }
                }

                // Create clue text
                const clueDiv = document.createElement('div');
                clueDiv.className = 'clue-item';
                clueDiv.style.alignItems = 'center';
                clueDiv.innerHTML = `
                    <span class="clue-num">${currentDisplayNum}.</span>
                    <span style="flex:1;">${el.clueDescription}</span>
                    <button onclick="submitCrosswordWord(${el.id})" style="width: auto; padding: 6px 12px; font-size: 0.8rem; border-radius: 8px;">제출</button>
                `;

                if (clueType === 'ACROSS') {
                    hClues.appendChild(clueDiv);
                } else if (clueType === 'DOWN') {
                    vClues.appendChild(clueDiv);
                }
            });
        }

        async function submitCrosswordWord(hintId) {
            // 해당 힌트 ID가 포함된 모든 입력 칸을 DOM 순서(좌->우, 상->하)대로 찾음
            const inputs = document.querySelectorAll('.cw-cell input');
            let answerStr = '';
            const targetInputs = [];

            inputs.forEach(input => {
                if (input.dataset.clueIds) {
                    const ids = JSON.parse(input.dataset.clueIds);
                    if (ids.includes(hintId)) {
                        answerStr += input.value || ' ';
                        targetInputs.push(input);
                    }
                }
            });

            answerStr = answerStr.trim();
            if (!answerStr) {
                toast('단어를 입력해주세요!', 'error');
                return;
            }

            try {
                const res = await fetch(`/api/v1/crosswords/${currentCwId}/submit?crosswordHintId=${hintId}&answer=${encodeURIComponent(answerStr)}`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                
                if (data.isSuccess) {
                    if (data.result.isCorrect) {
                        toast('정답입니다! 🎉', 'success');
                        targetInputs.forEach(input => {
                            input.style.backgroundColor = 'rgba(16, 185, 129, 0.2)'; // Green
                            input.style.color = '#10b981';
                        });
                        
                        // Check if game is completed
                        if (data.result.hasNext === false) {
                            showClearModal(data.result.score);
                        }
                    } else {
                        toast('오답입니다. 다시 시도해보세요!', 'error');
                        targetInputs.forEach(input => {
                            input.style.backgroundColor = 'rgba(239, 68, 68, 0.2)'; // Red
                            setTimeout(() => {
                                input.style.backgroundColor = 'rgba(255,255,255,0.05)';
                            }, 1000);
                        });
                    }
                } else {
                    toast(data.message, 'error');
                }
            } catch (e) {
                console.error(e);
                toast('제출 중 오류가 발생했습니다.', 'error');
            }
        }

        function showClearModal(score) {
            let totalSeconds = 0;
            if (typeof score === 'number') {
                totalSeconds = score; // Assuming seconds if number
            } else if (typeof score === 'string') {
                // Parse ISO-8601 duration (e.g., PT1M30S)
                const matchM = score.match(/(\d+)M/);
                const matchS = score.match(/(\d+(?:\.\d+)?)S/);
                const matchH = score.match(/(\d+)H/);
                
                if (matchH) totalSeconds += parseInt(matchH[1]) * 3600;
                if (matchM) totalSeconds += parseInt(matchM[1]) * 60;
                if (matchS) totalSeconds += parseFloat(matchS[1]);
            }
            
            const m = Math.floor(totalSeconds / 60);
            const s = Math.floor(totalSeconds % 60);
            let timeText = '';
            if (m > 0) timeText += `${m}분 `;
            timeText += `${s}초`;

            document.getElementById('clear-time').innerText = `소요 시간: ${timeText}`;
            document.getElementById('overlay').classList.remove('hidden');
            document.getElementById('clear-modal').classList.remove('hidden');
        }

        function switchUI(id) {
            document.getElementById('overlay').classList.add('hidden');
            document.getElementById('clear-modal').classList.add('hidden');
            document.querySelectorAll('.card:not(#clear-modal)').forEach(c => c.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        function toast(msg, type) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.display = 'block';
            t.style.borderLeft = `4px solid ${type === 'error' ? '#ef4444' : '#f43f5e'}`;
            setTimeout(() => t.style.display = 'none', 2000);
        }

        window.onload = () => { if (token) showList(); };
    </script>
</body>
</html>
