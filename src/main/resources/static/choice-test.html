<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VocaBook Quiz | Final Refactored</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #0b0f1a;
            --card-bg: rgba(23, 28, 41, 0.8);
            --text: #f1f5f9;
            --text-muted: #64748b;
            --success: #10b981;
            --error: #ef4444;
            --warning: #f59e0b;
            --border: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .container { width: 100%; max-width: 480px; }
        .card { background: var(--card-bg); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 32px; padding: 40px 32px; box-shadow: 0 40px 100px -20px rgba(0, 0, 0, 0.7); }
        h1 { font-size: 2.2rem; text-align: center; margin-bottom: 32px; font-weight: 800; background: linear-gradient(to right, #818cf8, #34d399); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* Auth */
        .form-group { margin-bottom: 20px; }
        input { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 16px; padding: 16px; color: white; transition: 0.3s; }
        input:focus { outline: none; border-color: var(--primary); }

        /* List */
        .choice-item { background: rgba(255,255,255,0.03); border: 1px solid var(--border); padding: 24px; border-radius: 20px; margin-bottom: 16px; cursor: pointer; transition: 0.3s; display: flex; justify-content: space-between; align-items: center; }
        .choice-item:hover { transform: translateY(-4px); border-color: var(--primary); background: rgba(99, 102, 241, 0.05); }
        .choice-title { font-size: 1.4rem; font-weight: 700; }

        /* Quiz */
        .timer-track { width: 100%; height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; margin-bottom: 40px; overflow: hidden; }
        .timer-bar { width: 100%; height: 100%; background: var(--primary); transition: width linear; }
        .question-text { font-size: 2.4rem; font-weight: 800; text-align: center; margin-bottom: 48px; line-height: 1.2; }
        .options { display: grid; gap: 16px; }
        .opt-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--border); padding: 24px; border-radius: 20px; font-size: 1.1rem; font-weight: 600; text-align: center; cursor: pointer; transition: 0.2s; }
        .opt-btn:hover { background: rgba(255,255,255,0.1); }
        .opt-btn.correct { background: var(--success); color: white; border-color: var(--success); }
        .opt-btn.wrong { background: var(--error); color: white; border-color: var(--error); }

        .hidden { display: none; }
        button { width: 100%; background: var(--primary); color: white; border: none; padding: 18px; border-radius: 16px; font-size: 1.1rem; font-weight: 700; cursor: pointer; transition: 0.3s; }
        #toast { position: fixed; top: 32px; left: 50%; transform: translateX(-50%); background: #1e293b; padding: 12px 24px; border-radius: 12px; z-index: 1000; display: none; border-left: 4px solid var(--primary); }
    </style>
</head>
<body>
    <div class="container">
        <!-- Auth UI -->
        <div id="auth-ui" class="card">
            <h1>Voca Master</h1>
            <div class="form-group"><input type="email" id="email" value="test@test.com"></div>
            <div class="form-group"><input type="password" id="password" value="12341234"></div>
            <button onclick="login()">Login to Play</button>
        </div>

        <!-- List UI -->
        <div id="list-ui" class="card hidden">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                <h2 style="font-size: 1.5rem;">Select Quiz</h2>
                <button onclick="logout()" style="width:auto; padding:8px 16px; background:transparent; border:1px solid var(--border);">Logout</button>
            </div>
            <div id="list-container"></div>
        </div>

        <!-- Quiz UI -->
        <div id="quiz-ui" class="card hidden">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <span id="quiz-info" style="font-weight:700; color:var(--primary);">Set #0</span>
                <span id="score-info" style="font-weight:700; color:var(--success);">Score: 0</span>
            </div>
            <div class="timer-track"><div id="timer-bar" class="timer-bar"></div></div>
            <div id="question-box" class="question-text">Question</div>
            <div id="options-box" class="options"></div>
        </div>

        <!-- Result UI -->
        <div id="result-ui" class="card hidden" style="text-align: center;">
            <div style="font-size: 4rem; margin-bottom: 16px;">🎊</div>
            <h2>Well Done!</h2>
            <div style="margin: 32px 0; padding: 24px; background: rgba(255,255,255,0.03); border-radius: 24px;">
                <p style="color:var(--text-muted);">Final Cumulative Score</p>
                <div id="final-score" style="font-size: 4.5rem; font-weight: 800; color: var(--success);">0</div>
            </div>
            <button onclick="showList()">Play Another Quiz</button>
        </div>
    </div>

    <div id="toast"></div>

    <script>
        let token = localStorage.getItem('access_token');
        let currentChoiceId = null;
        let memberChoiceId = null;
        let currentQuestionId = null;
        let timerTimeout = null;

        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const res = await fetch('/auth/v1/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const data = await res.json();
            if (data.isSuccess) {
                token = data.result.accessToken;
                localStorage.setItem('access_token', token);
                showList();
            } else toast(data.message, 'error');
        }

        function logout() { localStorage.removeItem('access_token'); location.reload(); }

        async function showList() {
            if (!token) return;
            switchUI('list-ui');
            const res = await fetch('/api/v1/choices?cursor=-1&pageSize=10', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await res.json();
            const container = document.getElementById('list-container');
            container.innerHTML = '';
            
            // Paging Schema: data.result.data
            if (data.result && data.result.data) {
                data.result.data.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'choice-item';
                    div.onclick = () => startQuiz(item.id);
                    div.innerHTML = `
                        <div>
                            <div class="choice-title">Set #${item.id}</div>
                            <div style="font-size: 0.85rem; color: var(--text-muted); margin-top: 4px;">Played: ${item.cnt} times</div>
                        </div>
                        <div style="color:#f59e0b; font-weight:700;">🪙 ${item.solvedCoin}</div>
                    `;
                    container.appendChild(div);
                });
            }
        }

        function startQuiz(id) {
            currentChoiceId = id;
            switchUI('quiz-ui');
            fetchQuestion(0);
        }

        async function fetchQuestion(qId) {
            currentQuestionId = qId;
            const res = await fetch(`/api/v1/choices/${currentChoiceId}?current=${qId}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (res.status === 204) return showResult();
            
            const data = await res.json();
            if (!data.isSuccess) return toast(data.message, 'error');
            
            const result = data.result;
            memberChoiceId = result.id;
            document.getElementById('quiz-info').innerText = `Set #${currentChoiceId} - Q#${qId}`;
            document.getElementById('score-info').innerText = `Score: ${result.score}`;
            document.getElementById('question-box').innerText = result.question;
            
            const optBox = document.getElementById('options-box');
            optBox.innerHTML = '';
            result.choices.forEach(opt => {
                const b = document.createElement('div');
                b.className = 'opt-btn';
                b.innerText = opt.text;
                b.onclick = () => submit(opt.id, b);
                optBox.appendChild(b);
            });

            startTimer();
        }

        function startTimer() {
            const bar = document.getElementById('timer-bar');
            bar.style.transition = 'none';
            bar.style.width = '100%';
            clearTimeout(timerTimeout);
            setTimeout(() => {
                bar.style.transition = 'width 5s linear';
                bar.style.width = '0%';
            }, 50);
            timerTimeout = setTimeout(() => submit(0, null), 5050);
        }

        async function submit(ansId, btn) {
            clearTimeout(timerTimeout);
            document.querySelectorAll('.opt-btn').forEach(b => b.style.pointerEvents = 'none');

            try {
                // Submit Schema: isCorrect, hasNext, nextCurrent, score
                const res = await fetch(`/api/v1/choices/${currentChoiceId}/submit?answer=${ansId}&current=${currentQuestionId}`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                
                // Real-time server-side score update
                document.getElementById('score-info').innerText = `Score: ${data.result.score}`;

                if (btn) {
                    if (data.result.isCorrect) btn.classList.add('correct');
                    else btn.classList.add('wrong');
                } else toast('Time Out! ⏰', 'error');

                setTimeout(() => {
                    if (data.result.hasNext) fetchQuestion(data.result.nextCurrent);
                    else showResult();
                }, 800);
            } catch (e) { toast('Submit Error', 'error'); }
        }

        function showResult() {
            switchUI('result-ui');
            document.getElementById('final-score').innerText = document.getElementById('score-info').innerText.split(': ')[1];
        }

        function switchUI(id) {
            document.querySelectorAll('.card').forEach(c => c.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        function toast(msg, type) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.display = 'block';
            t.style.borderLeft = `4px solid ${type === 'error' ? '#ef4444' : '#10b981'}`;
            setTimeout(() => t.style.display = 'none', 2000);
        }

        window.onload = () => { if (token) showList(); };
    </script>
</body>
</html>
